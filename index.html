<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Ícone - 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0B0C10; color: #fff; font-family: 'Inter', sans-serif; }
        .icon-container {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #151621 0%, #0B0C10 100%);
            border: 2.5px solid #252738;
            box-shadow: 0 0 35px rgba(255, 59, 92, 0.3), inset 0 0 15px rgba(0, 229, 255, 0.15);
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .neon-glow-red {
            filter: drop-shadow(0 0 10px rgba(255, 59, 92, 0.6));
        }
        .neon-glow-cyan {
            filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.6));
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="text-center mb-6">
        <h1 class="text-lg font-bold tracking-wider text-white uppercase">Seu Ícone Personalizado</h1>
        <p class="text-xs text-gray-400 mt-1">Design Tecnológico & Foco em Finanças</p>
    </div>

    <!-- O ÍCONE (Pode tirar print ou salvar) -->
    <div class="icon-container select-none">
        <!-- Detalhe decorativo de fundo (Linhas de gráfico sutis) -->
        <div class="absolute inset-0 opacity-10 flex items-end justify-between px-4 pb-4 pointer-events-none">
            <div class="w-2 h-10 bg-[#FF3B5C] rounded-t"></div>
            <div class="w-2 h-16 bg-[#00E676] rounded-t"></div>
            <div class="w-2 h-24 bg-[#00E5FF] rounded-t"></div>
        </div>

        <!-- Símbolo Central (Gráfico ascendente + Cifrão tecnológico) -->
        <div class="relative z-10 flex flex-col items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14 text-[#FF3B5C] neon-glow-red" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
            <span class="font-mono text-xl font-bold tracking-widest text-[#00E5FF] neon-glow-cyan mt-1">2026</span>
        </div>
    </div>

    <div class="mt-8 text-center max-w-xs">
        <p class="text-xs text-gray-400 leading-relaxed">
            💡 <b>Como usar no celular:</b> Dê um print na tela focando bem no quadrado do ícone, recorte nas bordas arredondadas e defina como imagem de atalho do seu aplicativo na tela inicial!
        </p>
    </div>

</body>
</html>
